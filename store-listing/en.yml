name: Dark Neon Yellow
summary: Dark graphite Chrome theme with acid neon yellow accents.
description: |
  Dark Neon Yellow is a Chrome theme built around a black and graphite base
  with sharp acid-neon yellow highlights.

  It is designed to feel like a starship warning system at night:
  dark metal surfaces, cold depth, and controlled high-contrast accents.

  Best for users who want:
  - a dark browser frame
  - vivid neon-yellow toolbar icons and text
  - a cleaner sci-fi look without bright backgrounds
