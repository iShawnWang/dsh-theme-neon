name: Dark Neon Yellow
summary: Tema oscuro para Chrome en grafito con acentos amarillo neon acido.
description: |
  Dark Neon Yellow es un tema de Chrome con base negra y grafito, combinado
  con acentos intensos en amarillo neon acido.

  La atmosfera recuerda a un sistema de advertencia de una nave estelar:
  superficies oscuras, profundidad fria y contraste controlado.
