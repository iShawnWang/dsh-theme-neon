name: Dark Neon Yellow
summary: Theme Chrome sombre graphite avec accents jaune neon acide.
description: |
  Dark Neon Yellow est un theme Chrome base sur un fond noir et graphite,
  avec des accents jaune neon acide tres visibles.

  L'ensemble evoque un systeme d'alerte de vaisseau spatial:
  surfaces sombres, profondeur froide et contraste bien maitrise.
