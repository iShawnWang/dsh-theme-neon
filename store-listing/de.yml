name: Dark Neon Yellow
summary: Dunkles Chrome-Theme in Graphit mit acid-neon-gelben Akzenten.
description: |
  Dark Neon Yellow ist ein Chrome-Theme mit schwarzer und graphitfarbener
  Basis sowie markanten acid-neon-gelben Highlights.

  Der Look erinnert an ein Warnsystem eines Raumschiffs bei Nacht:
  dunkle Metallflaechen, kuehle Tiefe und kontrollierte Kontraste.
